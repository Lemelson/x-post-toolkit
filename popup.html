<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Video Toolkit</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #161c22;
        --muted: #8b98a5;
        --text: #e7edf2;
        --accent: #1d9bf0;
        --good: #00ba7c;
        --danger: #f4212e;
        --line: #283340;
      }
      body {
        margin: 0;
        width: 360px;
        max-height: 600px;
        overflow: auto;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        padding: 12px;
      }
      .title {
        font-size: 14px;
        font-weight: 700;
      }
      .sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .panel {
        margin-top: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        background: #243141;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
      }
      button.good {
        background: #114838;
      }
      button.warn {
        background: #4a2024;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .status.good {
        color: #83ffc9;
      }
      .status.bad {
        color: #ff9ba3;
      }
      .section-title {
        margin-top: 12px;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .item {
        border-top: 1px solid var(--line);
        padding-top: 8px;
        margin-top: 8px;
      }
      .item:first-child {
        border-top: 0;
        padding-top: 0;
        margin-top: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .id {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      .age {
        color: var(--muted);
        font-size: 11px;
      }
      .preview {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .actions button {
        flex: 1;
        background: #263548;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        color: var(--muted);
        font-size: 11px;
      }
      input,
      select {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0f1419;
        color: var(--text);
        padding: 6px 8px;
        font-size: 12px;
      }
      .title-snippet {
        font-weight: 600;
        font-size: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">X Video Toolkit</div>
      <div class="sub" id="pageInfo">Current page: detecting tweet...</div>

      <div class="panel">
        <div class="grid">
          <button class="primary" id="transcribeBtn">Transcript Current</button>
          <button id="downloadVideoBtn">Download Video</button>
          <button class="good" id="downloadTxtBtn">Download Transcript</button>
          <button class="warn" id="clearHistoryBtn">Clear History</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="panel">
        <div class="section-title">History Settings</div>
        <div class="settings-grid">
          <div class="field">
            <label for="historyLimit">Max items</label>
            <input id="historyLimit" type="number" min="1" max="200" step="1" />
          </div>
          <div class="field">
            <label for="retentionValue">Retention</label>
            <div style="display:flex; gap:6px;">
              <input id="retentionValue" type="number" min="1" max="30" step="1" style="width:100%;" />
              <select id="retentionUnit">
                <option value="days">days</option>
                <option value="hours">hours</option>
              </select>
            </div>
          </div>
        </div>
        <div style="margin-top:8px;">
          <button id="saveSettingsBtn" class="primary" style="width:100%;">Save Settings</button>
        </div>
      </div>

      <div class="panel">
        <div class="section-title">Recent Transcripts</div>
        <div id="history"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
